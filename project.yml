# XcodeGen project definition: `xcodegen generate` writes SkyRay.xcodeproj (not committed).
name: SkyRay
options:
  bundleIdPrefix: com.allion
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    MARKETING_VERSION: "1.2.4"            # CI passes VERSION on the command line; keep in step by hand
    CURRENT_PROJECT_VERSION: "100"        # an Xcode archive: above 1.1.6's build 22; CI uses 100 + its run number
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1,2"         # iPhone and iPad: the store record shipped on iPad, an update may not drop it
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    GENERATE_INFOPLIST_FILE: "NO"
    # Automatic signing under the ALLION LLC team: "open in Xcode, run on an iPhone" works with no setup. CI's App
    # Store archive overrides this on the command line (manual signing, the distribution certificate and the two
    # profiles named in SKYRAY_PROFILE_APP / SKYRAY_PROFILE_TUNNEL, empty here so automatic signing sees none).
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: SG5BT8WSLT
    SKYRAY_PROFILE_APP: ""
    SKYRAY_PROFILE_TUNNEL: ""
    ENABLE_BITCODE: "NO"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
packages:
  SkyRayCore:
    path: Packages/SkyRayCore
  SkyRayXray:
    path: Packages/SkyRayXray
  SkyRayHev:
    path: Packages/SkyRayHev
targets:
  SkyRay:
    type: application
    platform: iOS
    sources:
      - path: SkyRay
    dependencies:
      - package: SkyRayCore
      - package: SkyRayXray
      - target: SkyRayTunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.allion.skyray
        PRODUCT_NAME: SkyRay
        INFOPLIST_FILE: Config/SkyRay/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/SkyRay/SkyRay.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(SKYRAY_PROFILE_APP)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: "NO"
  SkyRayTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: SkyRayTunnel
      - path: Vendor/geo/geoip.dat
        buildPhase: resources
      - path: Vendor/geo/geosite.dat
        buildPhase: resources
    dependencies:
      - package: SkyRayCore
      - package: SkyRayXray
      - package: SkyRayHev
    settings:
      base:
        # The extension's App ID already registered under the team by the previous SkyRay (com.allion.skyray.PacketTunnel):
        # the same id keeps the phones' existing VPN configuration valid across the update.
        PRODUCT_BUNDLE_IDENTIFIER: com.allion.skyray.PacketTunnel
        PRODUCT_NAME: SkyRayTunnel
        INFOPLIST_FILE: Config/SkyRayTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/SkyRayTunnel/SkyRayTunnel.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(SKYRAY_PROFILE_TUNNEL)
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SKIP_INSTALL: "YES"
schemes:
  SkyRay:
    build:
      targets:
        SkyRay: all
        SkyRayTunnel: all
    run:
      config: Debug
    archive:
      config: Release

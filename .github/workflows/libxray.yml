name: LibXray with the ECH fetch

# LibXray.xcframework is built here, not downloaded from upstream: XTLS/libXray at the tag pinned in
# Vendor/libxray-source.lock, with the subscription fetch with Encrypted Client Hello compiled into its C bridge
# (echfetch/, libxray/echfetch_export.go; scripts/build-libxray.sh). The zip is published as a release of this
# repository, named by what went into it, so every build — CI's and the Xcode archive on a Mac — downloads the very
# same file: Vendor/libxray.lock pins its sha256 and scripts/fetch-libxray.sh verifies it. One Go runtime per
# process: the fetch has to live inside LibXray, a second Go library beside it cannot be linked.
#
# Runs when one of its inputs changes. A release that already exists is left alone (the lock pins that file).
on:
  push:
    branches: ['**']   # branches only: a release tag (vX.Y.Z) does not start it
    paths:
      - 'echfetch/**'
      - 'libxray/**'
      - 'Vendor/libxray-source.lock'
      - 'scripts/build-libxray.sh'
      - '.github/workflows/libxray.yml'
  workflow_dispatch:

concurrency:
  group: libxray-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # the release that carries the zip, and the commit comment that carries a failed run's errors

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: What is being built
        id: v
        run: |
          set -euo pipefail
          TAG=$(sed -n 's/^tag=//p' Vendor/libxray-source.lock)
          GO=$(sed -n 's/^go=//p' Vendor/libxray-source.lock)
          # the release is named by its inputs: the same inputs never build twice, a changed one gets a new name
          HASH=$(cat Vendor/libxray-source.lock echfetch/echfetch.go echfetch/echfetch_darwin.go libxray/echfetch_export.go scripts/build-libxray.sh | shasum -a 256 | cut -c1-10)
          echo "release=libxray-$TAG-ech-$HASH" >> "$GITHUB_OUTPUT"
          echo "go=$GO" >> "$GITHUB_OUTPUT"
          echo "release libxray-$TAG-ech-$HASH, Go $GO"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.v.outputs.go }}
          cache: false

      - name: Test the ECH fetch (the Android repo's tests, and here on macOS the interface binding)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/echmod" && cp echfetch/*.go "$RUNNER_TEMP/echmod/"
          cd "$RUNNER_TEMP/echmod"
          printf 'module example.invalid/libv2ray\n\ngo 1.24\n' > go.mod
          { go vet ./... && go test -count=1 -v ./... ; } > "$RUNNER_TEMP/go-test.log" 2>&1 || { cat "$RUNNER_TEMP/go-test.log"; exit 1; }
          grep -E '^(--- |ok|PASS)' "$RUNNER_TEMP/go-test.log"

      - name: Is this release already published?
        id: have
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.v.outputs.release }}" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx 'libxray-apple-cgo.zip'; then
            echo "yes=true" >> "$GITHUB_OUTPUT"; echo "already published: nothing to build"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build LibXray.xcframework (upstream's recipe, every slice)
        if: steps.have.outputs.yes != 'true'
        run: |
          set -o pipefail
          xcodebuild -version
          scripts/build-libxray.sh > "$RUNNER_TEMP/build.log" 2>&1 || { tail -80 "$RUNNER_TEMP/build.log"; exit 1; }
          tail -12 "$RUNNER_TEMP/build.log"

      - name: Publish the zip as a release
        if: steps.have.outputs.yes != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA=$(shasum -a 256 build/libxray-apple-cgo.zip | cut -d' ' -f1)
          {
            echo "LibXray.xcframework for SkyRay iOS: XTLS/libXray $(sed -n 's/^tag=//p' Vendor/libxray-source.lock) with the subscription fetch with Encrypted Client Hello (\`CGoFetchSubscriptionEch\`), built by run ${{ github.run_number }} from commit $GITHUB_SHA."
            echo
            echo "sha256 of libxray-apple-cgo.zip: \`$SHA\`"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "${{ steps.v.outputs.release }}" build/libxray-apple-cgo.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "${{ steps.v.outputs.release }}" --notes-file "$RUNNER_TEMP/notes.md" --prerelease
          echo "published ${{ steps.v.outputs.release }}: sha256 $SHA"
          echo "::notice::${{ steps.v.outputs.release }} libxray-apple-cgo.zip sha256 $SHA"

      - name: Report a failure where it can be read without logging in
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            echo "## LibXray build ${{ github.run_number }} failed"
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            if [ -f "$RUNNER_TEMP/go-test.log" ]; then
              echo; echo "### Go tests (echfetch)"; echo '```'
              grep -E "FAIL|panic:|\.go:[0-9]+|^ok|^--- |vet:" "$RUNNER_TEMP/go-test.log" | head -60
              echo '```'
            fi
            if [ -f "$RUNNER_TEMP/build.log" ]; then
              echo; echo "### Build"; echo '```'
              grep -E "error|Error|failed|undefined|cannot|\.go:[0-9]+" "$RUNNER_TEMP/build.log" | sed "s#$GITHUB_WORKSPACE/##g" | head -60
              echo "…"; tail -15 "$RUNNER_TEMP/build.log" | sed "s#$GITHUB_WORKSPACE/##g"
              echo '```'
            fi
          } > "$RUNNER_TEMP/comment.md"
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null && echo "commit comment posted"
